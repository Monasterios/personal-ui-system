<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal UI System</title>

    <link rel="stylesheet" href="../design-system/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layouts.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<header>
    <h1>Personal UI System</h1>
</header>

<main class="l-main">
    <section>
        <h2>Components</h2>
        <p>
            A collection of reusable interface components built with our design system.
        </p>
        <div class="l-stack">
            <button class="c-button" type="button">
                Primary action
            </button>

            <button class="c-button" type="button" disabled>
                Disabled action
            </button>

            <article class="c-card">
                <h3 class="c-card__title">Project Card</h3>

                <p class="c-card__description">
                    A reusable card component built with our design system.
                </p>
                <div class="c-card__actions">
                    <button class="c-button" type="button">
                        View project
                    </button>
                </div>
            </article>

            <article class="c-card c-card--highlighted c-card--large">
                <h3 class="c-card__title">Highlighted Card</h3>

                <p class="c-card__description">
                    A highlighted variation of the card component.
                </p>
                <div class="c-card__actions">
                    <button class="c-button" type="button">
                        View project
                    </button>
                </div>
            </article>
        </div>
    </section>
</main>

<footer>
</footer>
</body>
</html>
